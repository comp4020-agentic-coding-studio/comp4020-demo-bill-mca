name = "hap-multiplayer"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Static front end (MapLibre page) served as Workers Assets, alongside the
# Worker code below which only handles the /ws realtime endpoint.
[assets]
directory = "./public"
binding = "ASSETS"

# One Durable Object class, "Room", backs every multi-user "room" (currently
# just one shared "lobby" room -- see src/worker.js). SQLite storage backend
# keeps this on Cloudflare's free Workers plan (key-value backend DOs require
# a paid plan; SQLite-backed DOs do not).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
