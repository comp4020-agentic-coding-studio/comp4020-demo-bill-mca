<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hap-Map Multiplayer (teaching exemplar)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

    <style>
        :root {
            --hap-navy: #16365c;
            --hap-navy-light: #1f4d83;
            --hap-accent: #f5a623;
        }
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
        #map { background: #0b1622; }

        #menu-btn {
            position: absolute; top: 10px; left: 10px; z-index: 8;
            width: 36px; height: 36px; border: none; border-radius: 8px;
            background: var(--hap-navy); color: #fff; font-size: 18px; line-height: 1;
            cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }
        #menu-dropdown {
            position: absolute; top: 52px; left: 10px; z-index: 8;
            background: #fff; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,0.35);
            overflow: hidden; display: none; min-width: 190px;
        }
        #menu-dropdown.open { display: block; }
        #menu-dropdown button {
            display: block; width: 100%; border: none; background: none; text-align: left;
            padding: 10px 14px; font-size: 13px; color: #16365c; cursor: pointer;
        }
        #menu-dropdown button:hover { background: #f0f3f7; }

        #overlay-panel {
            position: absolute; top: 52px; left: 10px; z-index: 9;
            background: #fff; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,0.4);
            padding: 14px 16px; font-size: 12px; color: #16365c; max-width: 260px;
            display: none;
        }
        #overlay-panel.open { display: block; }
        #overlay-panel h2 { margin: 0 0 6px; font-size: 13px; }
        #overlay-panel p { margin: 0 0 4px; line-height: 1.4; }
        #overlay-close {
            position: absolute; top: 4px; right: 6px; border: none; background: none;
            font-size: 16px; cursor: pointer; color: #999; padding: 4px;
        }
        #qr-wrap svg { display: block; width: 160px; height: 160px; margin: 6px 0; }

        /* Hamburger (menu-btn/menu-dropdown/overlay-panel) lives top-LEFT;
           the year picker lives top-RIGHT; the zoom control was moved to
           bottom-right (see JS) so it doesn't collide with #peers. Keeping
           the overlay panel and the year picker on opposite corners matters:
           an earlier version had both top-right and the open overlay panel
           would sit on top of (and silently swallow clicks on) the year
           buttons underneath it. */
        #years {
            position: absolute; top: 10px; right: 10px; z-index: 5;
            background: rgba(255,255,255,0.95); border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3); padding: 8px 6px;
            display: flex; flex-direction: column; gap: 3px; max-height: 70vh;
            overflow-y: auto;
        }
        #years button {
            border: none; background: #eee; color: #16365c; font-size: 12px;
            padding: 6px 10px; border-radius: 5px; cursor: pointer; font-weight: 600;
        }
        #years button.active { background: var(--hap-navy); color: #fff; }

        #who {
            position: absolute; bottom: 10px; left: 10px; z-index: 5;
            background: rgba(255,255,255,0.95); border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3); padding: 8px 10px;
            font-size: 12px; color: #16365c; display: flex; align-items: center; gap: 6px;
        }
        #who input {
            border: 1px solid #ccc; border-radius: 4px; padding: 3px 6px; font-size: 12px;
            width: 110px;
        }
        #who .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        #peers {
            position: absolute; bottom: 78px; right: 10px; z-index: 5;
            background: rgba(255,255,255,0.9); border-radius: 8px;
            padding: 6px 10px; font-size: 11px; color: #16365c; max-width: 200px;
        }

        .cursor-marker {
            width: 14px; height: 14px; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg); border: 2px solid white;
            box-shadow: 0 0 3px rgba(0,0,0,0.5);
        }
        .cursor-label {
            position: absolute; top: 14px; left: 10px; font-size: 10px;
            background: rgba(0,0,0,0.65); color: #fff; padding: 1px 5px;
            border-radius: 3px; white-space: nowrap; transform: rotate(45deg);
            transform-origin: top left;
        }
        .pin-marker {
            width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff;
            box-shadow: 0 0 4px rgba(0,0,0,0.6); cursor: pointer;
        }
        #hint {
            position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
            z-index: 5; background: rgba(0,0,0,0.6); color: #fff; font-size: 11px;
            padding: 4px 10px; border-radius: 10px; pointer-events: none;
        }
    </style>
</head>
<body>
    <button id="menu-btn" title="Menu" aria-label="Menu">&#9776;</button>
    <div id="menu-dropdown">
        <button id="menu-attribution" type="button">Attribution (current layer)</button>
        <button id="menu-room" type="button">Room &amp; QR code</button>
    </div>
    <div id="overlay-panel">
        <button id="overlay-close" type="button" aria-label="Close">&times;</button>
        <div id="overlay-content"></div>
    </div>

    <div id="years"></div>

    <div id="who">
        <span class="swatch" id="my-swatch"></span>
        <input id="name-input" placeholder="your name" maxlength="40" />
    </div>

    <div id="peers">Connecting&hellip;</div>

    <div id="map"></div>

    <script type="module">
        import { cogProtocol, setColorFunction }
            from 'https://esm.sh/@geomatico/maplibre-cog-protocol@0.9.0';
        import qrcode from 'https://esm.sh/qrcode-generator@1.4.4';
        maplibregl.addProtocol('cog', cogProtocol);

        // Imagery config copied verbatim (same URLs, same EPSG:3857, same
        // grayscale/no-data handling) from the real single-user tool at
        // https://hapmap-dev.u5007063.workers.dev/ -- see README.md. We load
        // the COGs and ACT ImageServer tiles directly, cross-origin (CORS is
        // open on both), rather than copying/duplicating any imagery data.
        const HAPMAP_DEV = 'https://hapmap-dev.u5007063.workers.dev';

        function grayscaleWithNoData(pixel, color, metadata) {
            const lum = pixel[0];
            const alpha = pixel[1];
            if (alpha === 0 || lum === metadata.noData || lum === null || isNaN(lum)) {
                color.set([0, 0, 0, 0]);
            } else {
                color.set([lum, lum, lum, alpha === undefined ? 255 : alpha]);
            }
        }

        // Unified credit string for every Geoscience Australia-sourced COG
        // layer below (1926/1944/1945/1955/1968/1974-75/1980) -- MapLibre
        // collapses identical attribution strings into a single credit.
        const GA_CREDIT = '&copy; cc-by Image data derived from Geoscience Australia\'s <a href="https://www.ga.gov.au/scientific-topics/national-location-information/historical-aerial-photography">historical aerial photography collection</a>';

        const COG_1955 = HAPMAP_DEV + '/cog/north-canberra-1955-cac80-3857.tif';
        // 2026-10-07: swapped to the full-scan Blag Map re-run -- the old
        // preview-frame key (canberra-1926-map3584-3857.tif) was deleted
        // from R2 after being superseded.
        const COG_1926 = HAPMAP_DEV + '/cog/canberra-1926-map3584-blag-3857.tif';
        const COG_1944 = HAPMAP_DEV + '/cog/act-1944-map658-753-blag-3857.tif';
        const COG_1945 = HAPMAP_DEV + '/cog/canberra-1945-map1537-blag-3857.tif';
        const COG_1968 = HAPMAP_DEV + '/cog/act-1968-cacc4-c15-blag-3857.tif';
        const COG_1974 = HAPMAP_DEV + '/cog/act-1974-75-cas896-920-blag-3857.tif';
        // 1980: deliberately NOT switched to the new Blag Map mosaic. That
        // swap on the real tool fixed a ~200m misplacement bug specific to
        // its old SOC276-279 layer; we've always used SOC195 here, which is
        // sharper (0.32m vs 2.5m) and doesn't have that bug. Revisit once a
        // full-scan Blag Map 1980 replaces SOC195 in the real tool.
        const COG_1980 = HAPMAP_DEV + '/cog/canberra-1980-soc195-3857.tif';
        setColorFunction(COG_1955, grayscaleWithNoData);
        setColorFunction(COG_1926, grayscaleWithNoData);
        setColorFunction(COG_1944, grayscaleWithNoData);
        setColorFunction(COG_1945, grayscaleWithNoData);
        setColorFunction(COG_1974, grayscaleWithNoData);

        function actImageryLayer(year, serviceName, resolutionLabel) {
            const layerId = 'imagery-act-' + year;
            const attribution = '&copy; ACT Government -- historical aerial imagery (' + resolutionLabel + ', licence unconfirmed)';
            return {
                year, layerId, attribution,
                addSource(map) {
                    map.addSource(layerId, {
                        type: 'raster',
                        tiles: [
                            'https://data4.actmapi.act.gov.au/arcgis/rest/services/ACT_IMAGERY_MGA2020/' +
                            serviceName +
                            '/ImageServer/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=png&f=image'
                        ],
                        tileSize: 256,
                        attribution
                    });
                }
            };
        }

        // Permanent bottom layer -- shows through wherever a historical/ACT
        // epoch layer is transparent (NoData edges, or the user has panned
        // outside that epoch's own coverage). Replaces the old always-on
        // Esri World_Imagery 2025 satellite base (Bill, 2026-10-07): OSM is
        // a plain street map rather than current-day satellite imagery, and
        // it is NOT one of the selectable IMAGERY_YEARS -- there's no "2025"
        // button any more, just this permanent backdrop.
        const OSM_BASE = {
            layerId: 'osm-base',
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            addSource(map) {
                map.addSource('osm-base', {
                    type: 'raster',
                    tiles: [
                        'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
                        'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
                        'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
                    ],
                    tileSize: 256, maxzoom: 19,
                    attribution: this.attribution
                });
            }
        };

        const IMAGERY_YEARS = [
            { year: 1926, layerId: 'imagery-1926',
                attribution: GA_CREDIT,
                addSource(map) {
                map.addSource('imagery-1926', { type: 'raster', url: 'cog://' + COG_1926, tileSize: 512,
                    attribution: this.attribution });
            }},
            { year: 1944, layerId: 'imagery-1944',
                attribution: GA_CREDIT,
                addSource(map) {
                map.addSource('imagery-1944', { type: 'raster', url: 'cog://' + COG_1944, tileSize: 512,
                    attribution: this.attribution });
            }},
            { year: 1945, layerId: 'imagery-1945',
                attribution: GA_CREDIT,
                addSource(map) {
                map.addSource('imagery-1945', { type: 'raster', url: 'cog://' + COG_1945, tileSize: 512,
                    attribution: this.attribution });
            }},
            { year: 1955, layerId: 'imagery-1955',
                attribution: GA_CREDIT,
                addSource(map) {
                map.addSource('imagery-1955', { type: 'raster', url: 'cog://' + COG_1955, tileSize: 512,
                    attribution: this.attribution });
            }},
            { year: 1968, layerId: 'imagery-1968',
                attribution: GA_CREDIT,
                addSource(map) {
                map.addSource('imagery-1968', { type: 'raster', url: 'cog://' + COG_1968, tileSize: 512,
                    attribution: this.attribution });
            }},
            { year: 1974, label: '1974\u201375', layerId: 'imagery-1974',
                attribution: GA_CREDIT,
                addSource(map) {
                map.addSource('imagery-1974', { type: 'raster', url: 'cog://' + COG_1974, tileSize: 512,
                    attribution: this.attribution });
            }},
            { year: 1980, layerId: 'imagery-1980',
                attribution: GA_CREDIT,
                addSource(map) {
                map.addSource('imagery-1980', { type: 'raster', url: 'cog://' + COG_1980, tileSize: 512,
                    attribution: this.attribution });
            }},
            actImageryLayer(2004, '2004_05_urban_150mm', '2004/05, 150mm'),
            actImageryLayer(2009, '2009_03_urban_100mm', '2009/03, 100mm'),
            actImageryLayer(2012, '2012_04_full_100mm', '2012/04, 100mm'),
            actImageryLayer(2017, '2017_05_full_100mm', '2017/05, 100mm'),
            actImageryLayer(2023, '2023_09_urban_75mm', '2023/09, 75mm'),
        ];
        const BASE = OSM_BASE;
        const DEFAULT_YEAR = IMAGERY_YEARS[IMAGERY_YEARS.length - 1].year;
        let activeYear = DEFAULT_YEAR;

        const map = new maplibregl.Map({
            container: 'map',
            bounds: [[149.0712015, -35.3140388], [149.1567188, -35.2841504]],
            fitBoundsOptions: { padding: 40 },
            // Combined bounding box of every raster layer above (computed
            // from each COG's own header + each ACT ImageServer's reported
            // extent, reprojected to WGS84; dominated by the 1968 and
            // 1974-75 whole-ACT flights). Panning is capped here so users
            // can't wander off into bare OSM with nothing historical to see.
            maxBounds: [[148.684938, -35.952099], [149.499726, -35.069789]],
            maxZoom: 21,
            attributionControl: false,
            style: { version: 8, sources: {}, layers: [
                { id: 'background', type: 'background', paint: { 'background-color': '#0b1622' } }
            ]}
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
        // No persistent AttributionControl -- Bill asked for fewer overlays on
        // the map itself. Attribution is still available, just on demand, via
        // the hamburger menu (shows only the currently-visible layer's own
        // attribution string, not every layer bundled together).

        function applyImagery(year) {
            IMAGERY_YEARS.forEach((entry) => {
                if (entry === BASE) return;
                map.setPaintProperty(entry.layerId, 'raster-opacity', entry.year === year ? 1 : 0);
            });
        }
        function setYear(year) {
            activeYear = year;
            applyImagery(year);
            document.querySelectorAll('#years button').forEach((b) => {
                b.classList.toggle('active', Number(b.dataset.year) === year);
            });
            // Keep the attribution overlay in sync if it's open while the
            // user switches years -- it should always describe the layer
            // that's actually visible, not whichever was visible when the
            // panel was opened.
            if (overlayMode === 'attribution' && overlayPanel.classList.contains('open')) {
                renderAttributionOverlay();
            }
        }

        map.on('load', () => {
            BASE.addSource(map);
            map.addLayer({ id: BASE.layerId, type: 'raster', source: BASE.layerId, paint: { 'raster-opacity': 1 } });
            IMAGERY_YEARS.forEach((entry) => {
                if (entry === BASE) return;
                entry.addSource(map);
                map.addLayer({ id: entry.layerId, type: 'raster', source: entry.layerId,
                    paint: { 'raster-opacity': 0, 'raster-opacity-transition': { duration: 500, delay: 0 } } });
            });

            const yearsEl = document.getElementById('years');
            IMAGERY_YEARS.forEach((entry) => {
                const btn = document.createElement('button');
                btn.textContent = entry.label || entry.year;
                btn.dataset.year = entry.year;
                btn.addEventListener('click', () => setYear(entry.year));
                yearsEl.appendChild(btn);
            });
            setYear(DEFAULT_YEAR);
        });

        // --------------------------------------------------------------
        // Multiplayer: one shared "lobby" room over a WebSocket to the
        // Durable Object in src/worker.js. Shared state = live cursors +
        // persisted pins; this is what makes the app multi-user/real-time.
        // --------------------------------------------------------------
        const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const roomName = new URLSearchParams(location.search).get('room') || 'lobby';
        const ws = new WebSocket(wsProto + '//' + location.host + '/ws?room=' + encodeURIComponent(roomName));

        let myId = null, myColor = '#999';
        // Server-authoritative count of connected sessions in this room
        // (includes self). Replaces the earlier client-side `peerMarkers.size`
        // approximation, which undercounted anyone who'd joined but not yet
        // moved their mouse -- see worker.js `count` field on init/join/leave.
        let totalCount = 0;
        const peerMarkers = new Map(); // id -> { marker, labelEl }
        const pinMarkers = new Map(); // pin id -> marker (feature off for now, kept for re-enable)

        // --------------------------------------------------------------
        // Hamburger menu: replaces the old always-on banner/title-card with
        // two on-demand overlays (Bill, 2026-10-02) -- (1) attribution of
        // just the currently-visible imagery layer, (2) room name + QR code
        // of this page's URL + live player count. Nothing is shown unless
        // the user opens the menu.
        // --------------------------------------------------------------
        const menuBtn = document.getElementById('menu-btn');
        const menuDropdown = document.getElementById('menu-dropdown');
        const overlayPanel = document.getElementById('overlay-panel');
        const overlayContent = document.getElementById('overlay-content');
        let overlayMode = null; // 'attribution' | 'room' | null

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuDropdown.classList.toggle('open');
        });
        menuDropdown.addEventListener('click', (e) => e.stopPropagation());
        overlayPanel.addEventListener('click', (e) => e.stopPropagation());
        document.addEventListener('click', () => menuDropdown.classList.remove('open'));

        document.getElementById('overlay-close').addEventListener('click', () => {
            overlayPanel.classList.remove('open');
            overlayMode = null;
        });

        function liveCountText() {
            return totalCount + (totalCount === 1 ? ' person' : ' people') + ' in this room right now';
        }

        function renderAttributionOverlay() {
            const entry = IMAGERY_YEARS.find((y) => y.year === activeYear);
            overlayContent.innerHTML =
                '<h2>Attribution -- ' + (entry ? (entry.label || entry.year) : 'current layer') + '</h2>' +
                '<p>' + (entry ? entry.attribution : '') + '</p>' +
                '<p style="margin-top:8px;padding-top:8px;border-top:1px solid #eee;">' +
                    OSM_BASE.attribution + '</p>';
        }

        function renderRoomOverlay() {
            overlayContent.innerHTML =
                '<h2>Room: ' + roomName + '</h2>' +
                '<div id="qr-wrap"></div>' +
                '<p id="room-count">' + liveCountText() + '</p>' +
                '<p style="font-size:10px;opacity:0.7;word-break:break-all;">' + location.href + '</p>';
            const qr = qrcode(0, 'M');
            qr.addData(location.href);
            qr.make();
            document.getElementById('qr-wrap').innerHTML = qr.createSvgTag();
        }

        document.getElementById('menu-attribution').addEventListener('click', () => {
            overlayMode = 'attribution';
            renderAttributionOverlay();
            overlayPanel.classList.add('open');
            menuDropdown.classList.remove('open');
        });
        document.getElementById('menu-room').addEventListener('click', () => {
            overlayMode = 'room';
            renderRoomOverlay();
            overlayPanel.classList.add('open');
            menuDropdown.classList.remove('open');
        });

        function peerCursorEl(color) {
            // NOTE: `wrap` is handed straight to `new maplibregl.Marker({element: wrap})`.
            // MapLibre's own `.maplibregl-marker` class makes this element
            // `position: absolute` so it shrink-wraps to its content and the
            // translate(-50%,-50%) centering math is correct. Setting
            // `wrap.style.position = 'relative'` here (the old bug) overrode
            // that with an inline style, turning `wrap` into a normal block
            // that stretches to the full map width -- which is why cursors
            // rendered nowhere near the actual pointer. Fix: keep `wrap`
            // untouched by maplibre, and put the position:relative context
            // (needed so the label can be absolutely positioned against the
            // dot) on a separate inner element instead.
            const wrap = document.createElement('div');
            const inner = document.createElement('div');
            inner.style.position = 'relative';
            const dot = document.createElement('div');
            dot.className = 'cursor-marker';
            dot.style.background = color;
            inner.appendChild(dot);
            const label = document.createElement('div');
            label.className = 'cursor-label';
            inner.appendChild(label);
            wrap.appendChild(inner);
            return { wrap, label };
        }

        function upsertPeer(id, color, lng, lat, name) {
            let entry = peerMarkers.get(id);
            if (!entry) {
                const { wrap, label } = peerCursorEl(color);
                const marker = new maplibregl.Marker({ element: wrap }).setLngLat([lng, lat]).addTo(map);
                entry = { marker, label };
                peerMarkers.set(id, entry);
            } else {
                entry.marker.setLngLat([lng, lat]);
            }
            if (name) entry.label.textContent = name;
        }
        function removePeer(id) {
            const entry = peerMarkers.get(id);
            if (entry) { entry.marker.remove(); peerMarkers.delete(id); }
        }
        // Pins/annotations are deliberately switched off for now (Bill, 2026-10-02):
        // with no login yet, an anonymous click-to-pin feature has no real author
        // identity behind it. addPin() is kept so it's a one-line re-enable once
        // auth exists, but nothing calls it and the map no longer takes click input.

        function renderPeerList() {
            const el = document.getElementById('peers');
            const n = Math.max(0, totalCount - 1); // exclude self
            el.textContent = n === 0 ? 'You are the only one here' :
                n + (n === 1 ? ' other person' : ' other people') + ' here';
            // Room overlay shows the same live count -- keep it in sync if open.
            if (overlayMode === 'room' && overlayPanel.classList.contains('open')) {
                const countEl = document.getElementById('room-count');
                if (countEl) countEl.textContent = liveCountText();
            }
        }

        ws.addEventListener('open', () => {
            document.getElementById('peers').textContent = 'Connected';
        });

        ws.addEventListener('message', (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'init') {
                myId = msg.id;
                myColor = msg.color;
                document.getElementById('my-swatch').style.background = myColor;
                // Server assigns a generic identity ("Visitor N") the moment we
                // connect -- prefill it so it's visible immediately, not blank
                // until someone bothers to type a name.
                if (msg.name) nameInput.value = msg.name;
                if (typeof msg.count === 'number') totalCount = msg.count;
                (msg.peers || []).forEach((p) => {
                    if (p.cursor) upsertPeer(p.id, p.color, p.cursor.lng, p.cursor.lat, p.name);
                });
                renderPeerList();
            } else if (msg.type === 'cursor') {
                upsertPeer(msg.id, msg.color, msg.lng, msg.lat, msg.name);
                renderPeerList();
            } else if (msg.type === 'name') {
                const entry = peerMarkers.get(msg.id);
                if (entry) entry.label.textContent = msg.name;
            } else if (msg.type === 'join') {
                if (typeof msg.count === 'number') totalCount = msg.count;
                renderPeerList();
            } else if (msg.type === 'leave') {
                removePeer(msg.id);
                if (typeof msg.count === 'number') totalCount = msg.count;
                renderPeerList();
            }
        });

        let lastSent = 0;
        map.on('mousemove', (e) => {
            const now = Date.now();
            if (now - lastSent < 80) return; // throttle to ~12/s
            lastSent = now;
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'cursor', lng: e.lngLat.lng, lat: e.lngLat.lat }));
            }
        });

        const nameInput = document.getElementById('name-input');
        nameInput.addEventListener('change', () => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'name', name: nameInput.value }));
            }
        });
    </script>
</body>
</html>
